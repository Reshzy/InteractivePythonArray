<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: home-comp-theater.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Convergence:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-header region chrome" data-region="header"><!-- Cream sticky header bar with a 1px warm bottom border spanning the viewport --></div>
  <div class="r-mark region chrome" data-region="mark"><!-- Small orange square logo mark at the left of the header --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- Header wordmark text Python Lists Playground in dark sans --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav region control" data-region="nav"><!-- Header text links Playground Methods Comparisons Challenges: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-theme region control" data-region="theme"><!-- Sun icon theme toggle at the far right of the header: rebuild the control's chrome from the crop (comp-spec.mjs --crop theme); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-variable region text" data-region="variable"><!-- Mono variable name fruits sitting left of the list stage --><p style="font-size:var(--r-variable-font);line-height:1.05;margin:0">variable</p></div>
  <div class="r-index-0 region text" data-region="index-0"><!-- Small index numeral 0 above the apple cell --><p style="line-height:1.05;margin:0">index-0</p></div>
  <div class="r-index-1 region text" data-region="index-1"><!-- Small index numeral 1 above the banana cell --><p style="line-height:1.05;margin:0">index-1</p></div>
  <div class="r-index-2 region text" data-region="index-2"><!-- Small index numeral 2 above the orange cell --><p style="line-height:1.05;margin:0">index-2</p></div>
  <div class="r-index-3 region text" data-region="index-3"><!-- Small index numeral 3 above the mango cell --><p style="line-height:1.05;margin:0">index-3</p></div>
  <div class="r-cell-0 region control" data-region="cell-0"><!-- Large white rounded list cell showing the string apple: rebuild the control's chrome from the crop (comp-spec.mjs --crop cell-0); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cell-1 region control" data-region="cell-1"><!-- Large white rounded list cell showing the string banana: rebuild the control's chrome from the crop (comp-spec.mjs --crop cell-1); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cell-2 region control" data-region="cell-2"><!-- Large white rounded list cell showing the string orange: rebuild the control's chrome from the crop (comp-spec.mjs --crop cell-2); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cell-3 region control" data-region="cell-3"><!-- Large orange-highlighted list cell showing the string mango just appended: rebuild the control's chrome from the crop (comp-spec.mjs --crop cell-3); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-preset region control" data-region="preset"><!-- Preset dropdown currently showing Fruits: rebuild the control's chrome from the crop (comp-spec.mjs --crop preset); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-method region control" data-region="method"><!-- Method dropdown currently showing append(): rebuild the control's chrome from the crop (comp-spec.mjs --crop method); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-value region control" data-region="value"><!-- Value text field containing mango: rebuild the control's chrome from the crop (comp-spec.mjs --crop value); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-run region control" data-region="run"><!-- Solid orange Run button, the primary action: rebuild the control's chrome from the crop (comp-spec.mjs --crop run); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-caption region text" data-region="caption"><!-- Generated code caption fruits.append mango returns None --><p style="font-size:var(--r-caption-font);line-height:1.05;margin:0">caption</p></div>
  <div class="r-methods-heading region text" data-region="methods-heading"><!-- Section heading Methods at the bottom of the first viewport --><p style="font-size:var(--r-methods-heading-font);font-family:var(--r-methods-heading-family),sans-serif;font-weight:var(--r-methods-heading-weight);line-height:1.05;margin:0">methods-heading</p></div>
</main>
</body>
</html>
